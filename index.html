<meta name="apple-mobile-web-app-title" content="Манга">
<style>
:root{color-scheme:dark;--bg:#0e0f13;--sf:#181a21;--sf2:#242732;--tx:#ebe8e1;--mu:#8a8f9c;--ac:#9aa8ff;--ok:#0e0f13;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,label:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
header{display:flex;align-items:center;gap:12px;padding:20px 16px 12px}
h1{font:600 28px/1.1 Georgia,"Times New Roman",serif;margin:0;letter-spacing:.2px}
.sub{color:var(--mu);font-size:13px}
.actions{display:flex;gap:10px;padding:4px 16px 16px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--ac);color:var(--ok);padding:12px 18px;border-radius:12px;font-weight:600}
.btn.alt{background:var(--sf2);color:var(--tx)}
.btn svg{width:20px;height:20px}
.btn{position:relative;overflow:hidden}
input[type=file]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.row{margin-bottom:28px;background:linear-gradient(180deg,#0e0f13,#15171d)}
.scw{position:relative}
.scr{overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;scrollbar-color:#3a3d48 transparent;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}
.scr::-webkit-scrollbar{height:4px}.scr::-webkit-scrollbar-thumb{background:#3a3d48;border-radius:2px}
.sin{width:max-content;min-width:100%}
.scw::before,.scw::after{content:"";position:absolute;top:0;bottom:0;width:26px;pointer-events:none;z-index:3;opacity:0;transition:opacity .2s}
.scw::after{right:0;background:linear-gradient(270deg,rgba(0,0,0,.6),transparent)}
.scw::before{left:0;background:linear-gradient(90deg,rgba(0,0,0,.6),transparent)}
.scw.mr::after,.scw.ml::before{opacity:1}
.books{display:grid;grid-auto-flow:column;grid-auto-columns:var(--cw);gap:16px;padding:28px 18px 0;position:relative;z-index:1;align-items:end;box-sizing:border-box;min-width:100%}
.plank{height:16px;background:linear-gradient(180deg,#7a5638,#4a3322 60%,#2f2015);border-top:1px solid #9a7350;box-shadow:0 12px 20px rgba(0,0,0,.65);position:relative;z-index:0}
.caps{display:grid;grid-auto-flow:column;grid-auto-columns:var(--cw);gap:16px;padding:12px 18px 0;align-items:start;box-sizing:border-box;min-width:100%}
.card{background:none;text-align:left;padding:0;display:block;width:100%;color:inherit}
.bk{position:relative;aspect-ratio:2/3;perspective:800px}
.bk::after{content:"";position:absolute;left:-2%;right:-8%;bottom:-5px;height:10px;background:radial-gradient(ellipse at center,rgba(0,0,0,.75),transparent 70%);z-index:-1}
.pg{position:absolute;inset:1.5% 0 1.5% 5%;background:repeating-linear-gradient(90deg,#f0ecdf 0 2px,#cdc6b2 2px 3px);border-radius:1px 4px 4px 1px;box-shadow:inset 0 0 12px rgba(0,0,0,.25),3px 0 0 #b9b2a0}
.pg i{position:absolute;left:0;bottom:0;height:3px;background:var(--ac)}
.cv{position:absolute;inset:0;transform-origin:left center;transform:none;border-radius:2px 5px 5px 2px;overflow:hidden;background:var(--sf);box-shadow:-6px 4px 14px rgba(0,0,0,.55)}
.cv img{width:100%;height:100%;object-fit:cover;display:block}
.cv::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.45),rgba(255,255,255,.12) 6%,transparent 14%,transparent 85%,rgba(0,0,0,.2))}
.cn{font-size:13px;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cm{color:var(--mu);font-size:12px}
.cv{transition:transform .28s cubic-bezier(.3,.7,.3,1)}
body{padding-bottom:84px}
#nav{position:fixed;left:0;right:0;bottom:0;z-index:4;display:flex;background:rgba(20,22,28,.97);border-top:1px solid var(--sf2);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tab{flex:1;background:none;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:12px}
.tab svg{width:26px;height:26px}
.tab.on{color:var(--ac)}
.hrt{fill:none}
.hrt.on{fill:currentColor;color:#ff6b8a}
.ib svg{width:18px;height:18px;vertical-align:-4px;margin-right:6px}
#rdFav svg{margin:0}
.bk{transition:transform .15s}
.card.lift{position:relative;z-index:5}
.card.lift .bk{transform:translateY(-8px) scale(1.07);filter:drop-shadow(0 12px 14px rgba(0,0,0,.6))}
.card.drag{pointer-events:none;z-index:20}
.books.top{z-index:50}
.row.drop{outline:2px dashed var(--ac);outline-offset:-4px}
.pen{position:absolute;z-index:60;transform:translateX(-50%);background:var(--ac);color:var(--ok);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:600;white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.5)}
.card.open .cv{transform:rotateY(-62deg)}
@media(hover:hover){.books .card:hover .cv{transform:rotateY(-62deg)}}
.card{-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
.cv img{pointer-events:none}
.shbar{display:flex;gap:10px;padding:4px 16px 40px}
.shbar .ib:disabled{opacity:.35}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;z-index:9}
.sheet.on{display:flex}
.panel{background:var(--sf);width:100%;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.lb{color:var(--mu);font-size:14px;display:flex;flex-direction:column;gap:6px}
.lb input{background:var(--bg);color:var(--tx);border:1px solid var(--sf2);border-radius:10px;padding:12px;font:inherit}
.pv{background:#000;border-radius:8px;height:38vh;display:flex;justify-content:center}
.pv img{max-width:100%;max-height:100%;object-fit:contain}
.bt{display:flex;gap:10px;justify-content:flex-end}
#edSl{accent-color:var(--ac);width:100%}
.empty{margin:8vh 24px;text-align:center;color:var(--mu)}
.empty svg{width:96px;height:96px;color:var(--sf2);margin-bottom:12px}
.empty b{display:block;color:var(--tx);font:600 20px Georgia,serif;margin-bottom:6px}
.msg{padding:0 16px 12px;color:var(--mu);font-size:14px}
#reader{position:fixed;inset:0;background:#000;display:none;z-index:5}
#reader.on{display:block}
#stage{position:absolute;inset:0;overflow:auto;display:flex}
#stage img{margin:auto;max-width:100%;max-height:100%;user-select:none;-webkit-user-drag:none}
#stage.wid img{width:100%;max-height:none;margin:0 auto auto}
.tb{position:absolute;left:0;right:0;background:rgba(14,15,19,.94);padding:10px 12px;display:flex;align-items:center;gap:10px;transition:transform .2s}
.top{top:0;padding-top:calc(10px + env(safe-area-inset-top,0px))}
.bot{bottom:0;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));flex-wrap:wrap}
#reader.hide .top{transform:translateY(-100%)}
#reader.hide .bot{transform:translateY(100%)}
.ib{background:var(--sf2);border-radius:10px;padding:8px 12px;font-size:14px;white-space:nowrap}
.tt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
#sl{flex:1 1 100%;accent-color:var(--ac)}
#cnt{color:var(--mu);font-size:14px;flex:1}
#stage{touch-action:pan-y}
#stage img{transform-origin:0 0;will-change:transform}
#stage.zm{overflow:hidden;touch-action:none}
#stage.anim img{transition:transform .22s ease-out}
#flip{position:absolute;inset:0;z-index:1;display:none;perspective:1800px;pointer-events:none;overflow:hidden;background:#000}
#fCv{position:absolute;inset:0;width:100%;height:100%;display:block}
.tb{z-index:2}
.fsb{margin-left:auto;padding:8px 10px}
.fsb svg{width:20px;height:20px;margin:0!important;vertical-align:middle!important}
.fsb[hidden]{display:none}
.top .fsb{margin-left:0}
.mo{width:100%;text-align:left;padding:14px 16px;font-size:16px}.mo.on{background:var(--ac);color:var(--ok);font-weight:600}
.tools{padding:0 16px 12px;display:flex;flex-direction:column;gap:10px}.tools[hidden]{display:none}
.srch{position:relative;display:flex;align-items:center}
.srch>svg{position:absolute;left:12px;width:18px;height:18px;color:var(--mu);pointer-events:none}
.srch input{width:100%;background:var(--sf);color:var(--tx);border:1px solid var(--sf2);border-radius:12px;padding:12px 42px;font:inherit;-webkit-appearance:none;appearance:none}
.srch input::-webkit-search-cancel-button{display:none}
.qx{position:absolute;right:6px;width:32px;height:32px;border-radius:50%;background:var(--sf2);color:var(--tx);font-size:18px;line-height:1}.qx[hidden]{display:none}
.chips{display:flex;gap:8px;flex-wrap:wrap}.ib.act{background:var(--ac);color:var(--ok);font-weight:600}
.sh-h{display:flex;align-items:center;gap:8px;padding:16px 18px 0;position:relative;z-index:1}
.sh-h svg{width:20px;height:20px;color:var(--ac);flex:none}.sh-h b{font:600 18px Georgia,serif;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sh-h span{color:var(--mu);font-size:13px;flex:1;white-space:nowrap}.sh-h .ib{padding:6px 10px}
.books .hint{width:calc(100vw - 36px)}
.hint{grid-column:1/-1;align-self:center;text-align:center;color:var(--mu);font-size:13px;padding:12px 0}

<script>
const $=s=>document.querySelector(s);
const IMG=/\.(jpe?g|png|webp|gif|avif|bmp)$/i, ZIP=/\.(cbz|zip|cbr|rar)$/i;
const nat=(a,b)=>a.localeCompare(b,undefined,{numeric:true,sensitivity:'base'});
const ls={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let books=[],cur=null,page=0,rtl=ls.get('rtl',true),wid=ls.get('wid',false),url=null,tok=0;

function icon(){return '<svg aria-hidden="true"><use href="#book"/></svg>'}
let q='',sortM=ls.get('sort','manual');
const norm=s=>String(s).toLowerCase().replace(/ё/g,'е'),cmp=(a,b)=>nat(a.name,b.name),fsh=()=>ls.get('fsh',[]);
function favSecs(){
  const by={};books.forEach(b=>{if(isFav(b))by[b.id]=b});
  const pl=new Set(),secs=fsh().map(s=>({id:s.id,name:s.name,bs:s.ids.filter(i=>by[i]&&!pl.has(i)&&pl.add(i)).map(i=>by[i])}));
  return{secs,free:Object.values(by).filter(b=>!pl.has(b.id)).sort(cmp)};
}
const slotW=n=>(innerWidth-36-(n-1)*16)/n+16;
const SS=ls.get('ss',{});let sst=null;
function ssSave(){clearTimeout(sst);sst=setTimeout(()=>{sst=null;ls.set('ss',SS)},250)}
function ssFlush(){if(sst){clearTimeout(sst);sst=null;ls.set('ss',SS)}}
addEventListener('pagehide',ssFlush);document.addEventListener('visibilitychange',()=>{if(document.hidden)ssFlush()});
function fade(w,s){w.classList.toggle('ml',s.scrollLeft>4);w.classList.toggle('mr',s.scrollLeft+s.clientWidth<s.scrollWidth-4)}
function render(){
  const lib=$('#lib');head();
  const FV=tab==='fav',n=innerWidth>=700?5:3,bw=(innerWidth-36-(n-1)*16)/n,qq=norm(q.trim()),man=sortM==='manual'&&!qq;
  const ok=b=>!qq||norm(b.name).includes(qq),ord=l=>sortM==='az'?l.slice().sort(cmp):sortM==='za'?l.slice().sort(cmp).reverse():l;
  const rw=(l,min)=>{const r=chunk(l,n);return r.length||!min?r:[[]]},one=(l,min)=>l.length||min?[l]:[],keep=man,slot=slotW(n);
  let G=[];lifted=null;
  $('.shbar').style.display=tab==='lib'&&man?'':'none';
  if(!FV){
    if(man){const L=layoutRows(n),need=Math.max(1,L.length),rows=Math.max(ls.get('sh',1),need);
      G=[{g:'',rows:Array.from({length:rows},(_,i)=>L[i]||[])}];$('#shDel').disabled=rows<=need}
    else G=[{g:'',rows:rw(ord(books.filter(ok)),0)}];
  }else{
    const{secs,free}=favSecs();
    let S=secs.map(s=>{const hit=!!qq&&norm(s.name).includes(qq);return{g:s.id,title:s.name,hit,bs:ord(hit||!qq?s.bs:s.bs.filter(ok))}}).filter(s=>!qq||s.hit||s.bs.length);
    if(sortM!=='manual'){S.sort((a,b)=>nat(a.title,b.title));if(sortM==='za')S.reverse()}
    const F=ord(free.filter(ok));
    G=S.map(s=>({g:s.g,title:s.title,shelf:1,n:s.bs.length,rows:one(s.bs,1)}));
    if(secs.length&&man||F.length)G.unshift({g:'',title:secs.length?'Без полки':null,n:F.length,rows:one(F,man)});
  }

      const id=f.name+f.size;
      if(books.some(x=>x.gid===id)){n++;continue}
      try{const m=await textMeta(f,f.name);Object.assign(m,{gid:id,id});fresh.push([mkBook(m),f]);n++}
      catch(e){fails.push(f.name+' ('+(e&&e.message||e)+')')}
      continue;
    }
    if(ZIP.test(f.name)){
      const id=f.name+f.size;
      if(books.some(x=>x.gid===id)){n++;continue}
      let m=null;
      try{
        const z=await JSZip.loadAsync(f);
        const names=Object.keys(z.files).filter(k=>!z.files[k].dir&&IMG.test(k)&&!/__MACOSX/.test(k)).sort(nat);
        if(names.length)m={type:'zip',names,file:f};
        else{
          const fb=Object.keys(z.files).find(k=>!z.files[k].dir&&/\.(fb2|epub)$/i.test(k));
          if(fb){
            const inner=await z.file(fb).async('blob');
            try{const tm=await textMeta(inner,fb);Object.assign(tm,{gid:id,id});fresh.push([mkBook(tm),inner]);n++}
            catch(e){fails.push(f.name+' ('+(e&&e.message||e)+')')}
          }
        }
      }catch(e){
        if(/\.(cbr|rar)$/i.test(f.name)){
          try{
            let u;try{u=await loadUnrar()}catch(e3){unrarP=null;throw new Error('модуль RAR не загрузился: '+(e3.message||e3))}
            const ex=await u.m.createExtractorFromData({wasmBinary:u.w,data:new Uint8Array(await f.arrayBuffer())});
            const names=[...ex.getFileList().fileHeaders].filter(h=>!h.flags.directory&&IMG.test(h.name)).map(h=>h.name).sort(nat);
            if(names.length)m={type:'rar',names,file:f};
          }catch(e2){fails.push(f.name+' ('+(e2&&e2.message||e2)+')')}
        }else fails.push(f.name+' ('+(e&&e.message||e)+')');
      }
      if(m){Object.assign(m,{gid:id,id,name:f.name.replace(ZIP,''),count:m.names.length});fresh.push([mkBook(m),f]);n++}
    }else if(IMG.test(f.name)){
      const p=f.webkitRelativePath||f.name,d=p.includes('/')?p.slice(0,p.lastIndexOf('/')):'Изображения';
      (groups[d]=groups[d]||[]).push(f);
    }
  }
  for(const d in groups){
    const fs=groups[d].sort((a,b)=>nat(a.name,b.name)),id=d+fs.length;
    if(books.some(x=>x.gid===id)){n++;continue}
    const m={type:'img',gid:id,id,name:d.split('/').pop(),count:fs.length,names:fs.map(x=>x.name),files:fs};
    fresh.push([mkBook(m),fs]);n++;
  }
  fresh.forEach(([b])=>{b.init=1;b.name=ls.get('n:'+b.id,b.name);b.cp=ls.get('c:'+b.id,0);books.push(b)});
  books.sort((a,b)=>nat(a.name,b.name));
  $('#msg').textContent=fails.length?('Не удалось открыть: '+fails.join(', ')):n?'':'Подходящих файлов не найдено. Нужны CBZ, CBR, ZIP, EPUB, FB2, TXT или картинки.';
  render();if(n&&!fails.length)setTab('lib');
  fresh.forEach(([b,f])=>persist(b,f));
}

/* ================= Бумажное листание: curl-движок на canvas ================= */
const BIG=6000,RAD=Math.PI/180,LP=.35,LZ=.94;
const paperTex=(()=>{
  const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');
  x.fillStyle='#ece4d0';x.fillRect(0,0,128,128);

/* --- кэш предварительно подготовленных страниц (чтобы жест стартовал без задержки) --- */
const bakeC=new Map();
function geo(){const rd=$(IT()?'#treader':'#reader');return{W:rd.clientWidth||innerWidth,H:rd.clientHeight||innerHeight,dpr:Math.max(1,Math.min(window.devicePixelRatio||1,2,Math.sqrt(2.2e6/Math.max(1,(rd.clientWidth||innerWidth)*(rd.clientHeight||innerHeight)))))}}
function bakeFor(i){if(IT())return tBake(i);
  const g=geo(),key=g.W+'x'+g.H+'@'+g.dpr,e=bakeC.get(i);
  if(e&&e.key===key)return e.p;
  const p=(async()=>{
    const u=await urlFor(i),im=new Image();im.src=u;
    try{await im.decode()}catch(err){if(!im.complete)await new Promise(r=>{im.onload=im.onerror=r})}
    const nw=im.naturalWidth||1,nh=im.naturalHeight||1,k=Math.min(1,g.W/nw,g.H/nh),w=nw*k,h=nh*k;
    let d=g.dpr;const area=w*h*d*d;if(area>2.4e6)d*=Math.sqrt(2.4e6/area);
    const c=document.createElement('canvas');c.width=Math.max(1,Math.round(w*d));c.height=Math.max(1,Math.round(h*d));
    const x=c.getContext('2d');x.imageSmoothingQuality='high';x.drawImage(im,0,0,c.width,c.height);
    return{c,w,h};
  })();
  p.catch(()=>{const q=bakeC.get(i);if(q&&q.p===p)bakeC.delete(i)});
  bakeC.set(i,{key,p});return p;
}
let prepTok=0;
function prepNeighbors(){if(IT())return;
  for(const k of [...bakeC.keys()])if(Math.abs(k-page)>1)bakeC.delete(k);
  const my=++prepTok,nap=ms=>new Promise(r=>setTimeout(r,ms));
  const run=async()=>{
    for(const i of [page,page+1,page-1]){
      while(fl&&my===prepTok)await nap(150);
      if(my!==prepTok||!cur)return;
      if(i>=0&&i<cur.count){try{await bakeFor(i)}catch(e){}await nap(40)}
    }
  };
  setTimeout(()=>{run().catch(()=>{})},200);
}

/* --- геометрия завитка: страница скручивается в «рулон» вдоль направления d --- */
function setGeo(f,ang){
  f.ang=ang;const sx=RT()?1:-1,dx=sx*Math.cos(ang),dy=Math.sin(ang);
  f.dx=dx;f.dy=dy;f.phi=Math.atan2(dy,dx);
  const cs=[[0,0],[f.pw,0],[0,f.ph],[f.pw,f.ph]];let best=1e9,A=cs[0];
  for(const c of cs){const v=c[0]*dx+c[1]*dy;if(v<best){best=v;A=c}}
  f.Ax=A[0];f.Ay=A[1];
  let mx=0;for(const c of cs)mx=Math.max(mx,(c[0]-A[0])*dx+(c[1]-A[1])*dy);
  f.xmax=mx;f.r0=Math.max(15,Math.min(34,Math.min(f.pw,f.ph*.7)*.07));
  f.xend=mx+Math.PI*f.r0*1.5+(f.W-f.pw)/2/Math.max(.5,Math.abs(dx))+10;
}
const rOf=(f,c)=>f.r0*(1+.5*Math.min(1,c/f.xmax));
/* адаптивное качество: если кадры идут медленно, анимация рисуется в меньшем разрешении */
let curlQ=Math.max(.5,Math.min(1,+ls.get('cq',1)||1)),goodFlips=0;
function applyQ(f){
  const cv=FC(),d=f.gdpr*curlQ;f.dpr=d;
  cv.width=Math.round(f.W*d);cv.height=Math.round(f.H*d);
}
function qAdapt(f,now){

  if(f.lastT){const dt=now-f.lastT;if(dt<120){f.ema=f.ema?f.ema*.7+dt*.3:dt;f.nf=(f.nf||0)+1}}
  f.lastT=now;
  if(f.nf>=5&&f.ema>26&&curlQ>.5){
    curlQ=Math.max(.5,+(curlQ*.78).toFixed(2));ls.set('cq',curlQ);goodFlips=0;
    applyQ(f);f.nf=0;f.ema=0;f.slow=1;
  }
}
function qEnd(f){
  if(f.mode!=='curl'||f.slow||(f.nf||0)<12)return;
  if(f.ema&&f.ema<19&&curlQ<1){if(++goodFlips>=4){goodFlips=0;curlQ=Math.min(1,+(curlQ/.78).toFixed(2));ls.set('cq',curlQ)}}
  else goodFlips=0;
}
function dispOf(f,c){const r=rOf(f,c);return c<=Math.PI*r?c-r*Math.sin(c/r):2*c-Math.PI*r}

  for(let i=0;i<28;i++){const m=(lo+hi)/2;if(dispOf(f,m)<L)lo=m;else hi=m}

const cFromP=(f,p)=>f.mode==='curl'?(f.fwd?p:1-p)*f.xend:p, pFromC=(f,c)=>f.mode==='curl'?(f.fwd?c/f.xend:1-c/f.xend):c;

async function flipStart(tgt,opt){

  try{
    const [A,B]=await Promise.all([bakeFor(P),bakeFor(tgt)]);
    if(fl!==f)return;
    const g=geo(),curl=f.mode==='curl',leaf=fwd?A:B,under=fwd?B:A,cv=FC();
    const qd=g.dpr*(f.mode==='curl'?curlQ:1);
    if(cv.width!==Math.round(g.W*qd)||cv.height!==Math.round(g.H*qd)){cv.width=Math.round(g.W*qd);cv.height=Math.round(g.H*qd)}

function applyDrag(f){

/* плавное «догоняние» пальца: мягкая пружина по времени, а не по числу событий */
function setTarget(f,c){f.ct=c;if(!f.raf&&!f.busy)f.raf=requestAnimationFrame(n=>tickF(f,n))}
function tickF(f,now){

  const dt=Math.min(50,f.tl?now-f.tl:16);f.tl=now;
  const k=1-Math.pow(.5,dt/26),dc=f.ct-f.c;

  if(f.c!==f.ct)f.raf=requestAnimationFrame(n=>tickF(f,n));else{f.tl=0;f.lastT=0}

function paint(p){const f=fl;if(!f||!f.ready)return;f.c=f.ct=cFromP(f,p);drawFrame(f,f.c)}

function drawFrame(f,c){if(f.mode==='curl')drawCurl(f,c);else drawSlide(f,c)}
function drawSlide(f,q){

  ctx.drawImage(B.c,(W-B.w)/2+(vert?0:o2),(H-B.h)/2+(vert?o2:0),B.w,B.h);

function drawCurl(f,c){

  /* рулон: узкие полоски, каждая со своим наклоном к свету */

      const sh=Math.max(0,1-Math.abs(am-1.05)/.45)*.15;

    const x0=c-PI*r,g=ctx.createLinearGradient(f.Ax+dx*x0,f.Ay+dy*x0,f.Ax+dx*(x0-r*2.4),f.Ay+dy*(x0-r*2.4));

  }
}

function flipFinish(commit){
  const f=fl;if(!f||f.busy)return;f.busy=true;
  if(f.raf){cancelAnimationFrame(f.raf);f.raf=0}
  const done=async()=>{
    if(commit){if(IT())tSet(f.tgt);else{page=f.tgt;await show();try{await $('#pg').decode()}catch(e){}}}
    FE().style.display='none';if(fl===f)fl=null;
  };
  if(!f.ready){done();return}
  f.p=pFromC(f,f.c);
  const from=f.p,to=commit?1:0,t0=performance.now(),sl=f.mode!=='curl',dur=f.tap?(sl?420:680):(sl?180+180*Math.abs(to-from):230+330*Math.abs(to-from));
  const step=now=>{
    const k=Math.min(1,(now-t0)/dur),e=f.tap?-(Math.cos(Math.PI*k)-1)/2:1-Math.pow(1-k,3);
    f.p=from+(to-from)*e;qAdapt(f,now);paint(f.p);
    if(k<1)requestAnimationFrame(step);else{qEnd(f);done()}
  };

}
async function turn(d,y){

  zoomOff();
  if(rmode==='none'){go(d);return}
  await flipStart(tgt,{ang:((y==null?.8:y)>.5?-1:1)*12*RAD});
  if(fl&&fl.tgt===tgt){fl.tap=true;flipFinish(true)}
}

/* ---------------- жесты ---------------- */
const stg=$('#stage');
function pageRect(){const r=$('#pg').getBoundingClientRect();return r.width>40&&r.height>40?r:null}
/* ---- двойной тап: увеличение страницы ---- */
const ZS=2;let zm={s:1,tx:0,ty:0,base:null},pan=null;
function zApply(){$('#pg').style.transform=zm.s>1?'translate('+zm.tx+'px,'+zm.ty+'px) scale('+zm.s+')':''}
function zClamp(){

/* ---------- FB2 ---------- */
async function fb2Open(blob){

  bodies.filter(b=>b!==main).forEach(b=>[...b.getElementsByTagNameNS('*','section')].forEach(s=>{const id=s.getAttribute('id');if(id)notes[id]=s}));
  const len=e=>e.textContent.length,hasBody=ns=>ns.some(n=>len(n)>0||n.localName==='image');
  const titleOf=s=>{const t=kids(s,'title')[0];return t?txtOf(t):''};
  let L=kids(main,'section');
  for(let g=0;g<3&&L.length===1;g++){const s=kids(L[0],'section');if(s.length>1)L=s;else break}
  const U=[];
  if(!L.length)U.push({nodes:[...main.children],title:title||''});
  else{
    const intro=[...main.children].filter(c=>c.localName!=='section');
    if(hasBody(intro.filter(c=>c.localName!=='title')))U.push({nodes:intro,title:'Начало'});
    const add=(list,d)=>list.forEach(s=>{
      const subs=kids(s,'section');
      if(len(s)>150000&&subs.length>1&&d<2){
        const pre=[...s.children].filter(c=>c.localName!=='section');
        if(hasBody(pre.filter(c=>c.localName!=='title'))||titleOf(s))U.push({nodes:pre,title:titleOf(s)});
        add(subs,d+1);
      }else U.push({nodes:[s],title:titleOf(s)});
    });
    add(L,0);
  }
  U.forEach((u,i)=>{if(!u.title){const t=txtOf(u.nodes.find(n=>n.localName!=='title'&&txtOf(n)));u.title=t?t.slice(0,45)+(t.length>45?'…':''):'Часть '+(i+1)}});

  U.forEach((u,i)=>u.nodes.forEach(n=>own.set(n,i)));

    switch(t){

      case 'cite':e=to(el$('blockquote','cite'));break;

      case 'stanza':e=to(el$('div','st'));break;

async function txtOpen(blob,fname){
  const t=decodeText(await blob.arrayBuffer()).replace(/^﻿/,'').replace(/\r\n?/g,'\n');
  const lines=t.split('\n').map(s=>s.trim()).filter(Boolean),chunks=[];let cur=[],n=0;
  for(const l of lines){cur.push(l);n+=l.length;if(n>40000){chunks.push(cur);cur=[];n=0}}
  if(cur.length)chunks.push(cur);
  const base=String(fname).replace(/^.*[\\/]/,'').replace(/\.txt$/i,'');
  return{
    type:'txt',title:base,author:'',cover:null,count:chunks.length,
    titles:chunks.map((c,i)=>chunks.length>1?'Часть '+(i+1):base),
    async render(i,host){host.textContent='';const f=document.createDocumentFragment();chunks[i].forEach(l=>{const p=el$('p');p.textContent=l;f.appendChild(p)});host.appendChild(f)},
    noteText(){return ''},free(){}
  };
}

async function textMeta(blob,fname){
  const ext=(/\.(epub|fb2|txt)$/i.exec(fname)||[])[1].toLowerCase();
  const doc=ext==='epub'?await epubOpen(blob):ext==='fb2'?await fb2Open(blob):await txtOpen(blob,fname);
  if(!doc.count)throw new Error('нет текста');
  let cover=null;
  if(doc.cover){try{cover=await coverThumb(doc.cover)}catch(e){}}
  const name=(doc.title||'').trim()||String(fname).replace(/^.*[\\/]/,'').replace(/\.(epub|fb2|txt)$/i,'');
  if(!cover)cover=await makeCover(name,doc.author);
  doc.free();
  return{type:ext,name,author:doc.author||'',count:doc.count,names:doc.titles,file:blob,coverBlob:cover};
}
const docC=new Map();
async function getDoc(b){
  if(docC.has(b.gid)){const d=docC.get(b.gid);docC.delete(b.gid);docC.set(b.gid,d);return d}
  const f=b.meta.file||(await DB.get('f',b.gid)).blob;
  const d=b.type==='epub'?await epubOpen(f):b.type==='fb2'?await fb2Open(f):await txtOpen(f,b.name);
  docC.set(b.gid,d);
  while(docC.size>2){const k=docC.keys().next().value;docC.get(k).free();docC.delete(k)}
  return d;
}
function progPct(b){

}

let fT=0;$('#tFq').oninput=e=>{clearTimeout(fT);const v=e.target.value;fT=setTimeout(()=>tFind(v),300)};
async function tFind(v){
  const my=++fTok,L=$('#tFL'),st=$('#tFst');L.textContent='';st.textContent='';const q=norm(v.trim());if(!q)return;
  if(/^\d+$/.test(q)){const r=tGl();
    if(!r)st.textContent='Идёт подсчёт страниц — номера появятся через несколько секунд…';
    else{const N=+q,b=el$('button','ib mo');b.textContent=N>=1&&N<=r.t?'Перейти на страницу '+N+' из '+r.t:'Страницы '+N+' нет (всего '+r.t+')';
      if(N>=1&&N<=r.t)b.onclick=()=>{$('#tFS').classList.remove('on');tJumpS=null;$('#tJump').hidden=true;tGoPage(N)};L.appendChild(b)}
    return}
  let n=0;
  for(let i=0;i<tdoc.count&&n<150;i++){
    st.textContent='Поиск: гл. '+(i+1)+' / '+tdoc.count;let t;
    if(i===tch)t=$('#tBody').textContent;else{const d=el$('div');try{await tdoc.render(i,d)}catch(e){continue}t=d.textContent}
    if(my!==fTok||!tdoc)return;
    const lc=norm(t);
    for(let k=lc.indexOf(q);k>=0&&n<150;k=lc.indexOf(q,k+q.length)){
      n++;const b=el$('button','ib mo');b.style.whiteSpace='normal';b.innerHTML='<div class="cm"></div><div></div>';
      b.firstChild.textContent='Гл. '+(i+1)+(tdoc.titles[i]?' · '+tdoc.titles[i]:'');b.lastChild.textContent='…'+t.substr(Math.max(0,k-30),q.length+90).replace(/\s+/g,' ')+'…';
      b.onclick=()=>{$('#tFS').classList.remove('on');tOpenAt(i,k,q.length)};L.appendChild(b);
    }
  }
  st.textContent=n?'Найдено: '+n+(n>=150?'+':''):'Ничего не найдено';
}

/* ===== Точные номера страниц на всю книгу: считаются в простое, результат запоминается ===== */
let tSigNow='',tSig='',tPgs=[],tPgB='',tCT=0,tCalcTok=0;
function tGl(){
  if(!tdoc||!tbk||!tpgd()||tPgB!==tbk.id||tSig!==tSigNow)return null;let b=0,t=0;
  for(let j=0;j<tdoc.count;j++){const p=j===tch?tN:tPgs[j];if(p==null)return null;if(j<tch)b+=p;t+=p}
  return{g:b+tpg+1,t};
}
const tSleep=ms=>new Promise(r=>setTimeout(r,ms));
async function tGoPage(N){
  const my=++tTok;
  for(let a=0;a<5;a++){
    if(!tdoc||my!==tTok)return;
    const r=tGl();if(!r){await tSleep(700);continue}
    const T=r.t;N=Math.max(1,Math.min(T,N));let z=0;
    for(let j=0;j<tdoc.count;j++){const p=j===tch?tN:tPgs[j];
      if(N<=z+p){const l=N-z-1;if(j===tch)tSet(l);else{await showCh(j,0,null,l)}break}
      z+=p}
    await tSleep(450);
    const q=tGl();if(q&&q.g===N){tToast('Страница '+N+' из '+q.t);return}
  }
  const q=tGl();tToast(q?'Открыта страница '+q.g+' из '+q.t:'Не удалось точно перейти — повторите')
}
function tPnTxt(p){const r=tGl();return r?(r.g-tpg+p)+' / '+r.t:''}
function tGTxt(){
  const r=tGl();if(r)return'';
  if(tdoc&&tpgd()&&tPgB===tbk.id&&tSig===tSigNow)return' · подсчёт '+tPgs.filter(v=>v!=null).length+'/'+tdoc.count;return'';
}
function tStartTxt(i){if(!tdoc||!tbk||!tpgd()||tPgB!==tbk.id||tSig!==tSigNow)return'';let z=1;for(let j=0;j<i;j++){const p=j===tch?tN:tPgs[j];if(p==null)return'';z+=p}return' · стр. '+z}
function tCalcSoon(){clearTimeout(tCT);tCT=setTimeout(tCalc,1500)}
async function tCalc(){
  if(!tdoc||!tbk||!tpgd())return;const my=++tCalcTok,id=tbk.id,n=tdoc.count,sg=tSigNow,X=$('#tBodyX');
  if(tPgB!==id||tSig!==sg){const c=ls.get('pg2:'+id,null);tPgs=c&&c.s===sg?c.n:[];tPgB=id;tSig=sg}
  tPgs[tch]=tN;let k=0;
  const idle=()=>new Promise(r=>window.requestIdleCallback?requestIdleCallback(r,{timeout:3000}):setTimeout(r,80));
  const ok=()=>my===tCalcTok&&tdoc&&tbk&&tbk.id===id&&tpgd()&&tSigNow===sg;
  for(let i=0;i<n;i++){
    if(tPgs[i]!=null)continue;
    await idle();if(!ok())return;
    if(fl||tw||document.hidden||performance.now()-tAct<800){i--;await new Promise(r=>setTimeout(r,500));if(!ok())return;continue}
    let m=null;
    for(let at=0;at<4&&m==null;at++){
      const g0=tFG;
      try{
        await tdoc.render(i,X);await tImgs(X,8000);if(!ok())return;
        const broken=[...X.querySelectorAll('img')].some(im=>im.complete&&!im.naturalWidth);
        const v=Math.max(1,Math.round((X.scrollWidth+40)/tStep));
        if((g0===tFG&&!broken)||at===3)m=v;else await tSleep(300);
      }catch(e){if(at===3)m=1;else await tSleep(300)}
      if(!ok())return;
    }
    tPgs[i]=m;
    X.textContent='';if(++k%10===0)ls.set('pg2:'+id,{s:sg,n:tPgs});
  }
  X.textContent='';ls.set('pg2:'+id,{s:sg,n:tPgs});tUpd();
  if($('#tFS').classList.contains('on'))tFind($('#tFq').value);
}

render();restore();
</script>
