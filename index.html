<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0f13">
<title>Манга-читалка</title>
<style>
:root{color-scheme:dark;--bg:#0e0f13;--sf:#181a21;--sf2:#242732;--tx:#ebe8e1;--mu:#8a8f9c;--ac:#9aa8ff;--ok:#0e0f13;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,label:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
header{display:flex;align-items:center;gap:12px;padding:20px 16px 12px}
.logo{width:40px;height:40px;color:var(--ac);flex:none}
h1{font:600 28px/1.1 Georgia,"Times New Roman",serif;margin:0;letter-spacing:.2px}
.sub{color:var(--mu);font-size:13px}
.actions{display:flex;gap:10px;padding:4px 16px 16px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--ac);color:var(--ok);padding:12px 18px;border-radius:12px;font-weight:600}
.btn.alt{background:var(--sf2);color:var(--tx)}
.btn svg{width:20px;height:20px}
.btn{position:relative;overflow:hidden}
input[type=file]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.row{margin-bottom:28px;background:linear-gradient(180deg,#0e0f13,#15171d)}
.books{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:16px;padding:28px 18px 0;position:relative;z-index:1;align-items:end}
.plank{height:16px;background:linear-gradient(180deg,#7a5638,#4a3322 60%,#2f2015);border-top:1px solid #9a7350;box-shadow:0 12px 20px rgba(0,0,0,.65);position:relative;z-index:0}
.caps{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:16px;padding:12px 18px 0;align-items:start}
.card{background:none;text-align:left;padding:0;display:block;width:100%;color:inherit}
.bk{position:relative;aspect-ratio:2/3;perspective:800px}
.bk::after{content:"";position:absolute;left:-2%;right:-8%;bottom:-5px;height:10px;background:radial-gradient(ellipse at center,rgba(0,0,0,.75),transparent 70%);z-index:-1}
.pg{position:absolute;inset:1.5% 0 1.5% 5%;background:repeating-linear-gradient(90deg,#f0ecdf 0 2px,#cdc6b2 2px 3px);border-radius:1px 4px 4px 1px;box-shadow:inset 0 0 12px rgba(0,0,0,.25),3px 0 0 #b9b2a0}
.pg i{position:absolute;left:0;bottom:0;height:3px;background:var(--ac)}
.cv{position:absolute;inset:0;transform-origin:left center;transform:none;border-radius:2px 5px 5px 2px;overflow:hidden;background:var(--sf);box-shadow:-6px 4px 14px rgba(0,0,0,.55)}
.cv img{width:100%;height:100%;object-fit:cover;display:block}
.cv::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.45),rgba(255,255,255,.12) 6%,transparent 14%,transparent 85%,rgba(0,0,0,.2))}
.cn{font-size:13px;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cm{color:var(--mu);font-size:12px}
.cv{transition:transform .28s cubic-bezier(.3,.7,.3,1)}
body{padding-bottom:84px}
#nav{position:fixed;left:0;right:0;bottom:0;z-index:4;display:flex;background:rgba(20,22,28,.97);border-top:1px solid var(--sf2);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tab{flex:1;background:none;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:12px}
.tab svg{width:26px;height:26px}
.tab.on{color:var(--ac)}
.hrt{fill:none}
.hrt.on{fill:currentColor;color:#ff6b8a}
.ib svg{width:18px;height:18px;vertical-align:-4px;margin-right:6px}
#rdFav svg{margin:0}
.bk{transition:transform .15s}
.card.lift{position:relative;z-index:5}
.card.lift .bk{transform:translateY(-8px) scale(1.07);filter:drop-shadow(0 12px 14px rgba(0,0,0,.6))}
.card.drag{pointer-events:none;z-index:20}
.books.top{z-index:50}
.row.drop{outline:2px dashed var(--ac);outline-offset:-4px}
.pen{position:absolute;z-index:60;transform:translateX(-50%);background:var(--ac);color:var(--ok);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:600;white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.5)}
.card.open .cv{transform:rotateY(-62deg)}
@media(hover:hover){.books .card:hover .cv{transform:rotateY(-62deg)}}
.card{-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
.cv img{pointer-events:none}
.shbar{display:flex;gap:10px;padding:4px 16px 40px}
.shbar .ib:disabled{opacity:.35}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;z-index:9}
.sheet.on{display:flex}
.panel{background:var(--sf);width:100%;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.lb{color:var(--mu);font-size:14px;display:flex;flex-direction:column;gap:6px}
.lb input{background:var(--bg);color:var(--tx);border:1px solid var(--sf2);border-radius:10px;padding:12px;font:inherit}
.pv{background:#000;border-radius:8px;height:38vh;display:flex;justify-content:center}
.pv img{max-width:100%;max-height:100%;object-fit:contain}
.bt{display:flex;gap:10px;justify-content:flex-end}
#edSl{accent-color:var(--ac);width:100%}
.empty{margin:8vh 24px;text-align:center;color:var(--mu)}
.empty svg{width:96px;height:96px;color:var(--sf2);margin-bottom:12px}
.empty b{display:block;color:var(--tx);font:600 20px Georgia,serif;margin-bottom:6px}
.msg{padding:0 16px 12px;color:var(--mu);font-size:14px}
#reader{position:fixed;inset:0;background:#000;display:none;z-index:5}
#reader.on{display:block}
#stage{position:absolute;inset:0;overflow:auto;display:flex}
#stage img{margin:auto;max-width:100%;max-height:100%;user-select:none;-webkit-user-drag:none}
#stage.wid img{width:100%;max-height:none;margin:0 auto auto}
.tb{position:absolute;left:0;right:0;background:rgba(14,15,19,.94);padding:10px 12px;display:flex;align-items:center;gap:10px;transition:transform .2s}
.top{top:0;padding-top:calc(10px + env(safe-area-inset-top,0px))}
.bot{bottom:0;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));flex-wrap:wrap}
#reader.hide .top{transform:translateY(-100%)}
#reader.hide .bot{transform:translateY(100%)}
.ib{background:var(--sf2);border-radius:10px;padding:8px 12px;font-size:14px;white-space:nowrap}
.tt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
#sl{flex:1 1 100%;accent-color:var(--ac)}
#cnt{color:var(--mu);font-size:14px;flex:1}
#stage{touch-action:pan-y}
#stage img{transform-origin:0 0;will-change:transform}
#stage.zm{overflow:hidden;touch-action:none}
#stage.anim img{transition:transform .22s ease-out}
#flip{position:absolute;inset:0;z-index:1;display:none;perspective:1800px;pointer-events:none;overflow:hidden;background:#000}
#fCv{position:absolute;inset:0;width:100%;height:100%;display:block}
.tb{z-index:2}
.fsb{margin-left:auto;padding:8px 10px}
.fsb svg{width:20px;height:20px;margin:0!important;vertical-align:middle!important}
.fsb[hidden]{display:none}
.top .fsb{margin-left:0}
.mo{width:100%;text-align:left;padding:14px 16px;font-size:16px}.mo.on{background:var(--ac);color:var(--ok);font-weight:600}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><symbol id="book" viewBox="0 0 48 48"><path d="M24 11c-4-3-10-4-16-3v28c6-1 12 0 16 3 4-3 10-4 16-3V8c-6-1-12 0-16 3z" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/><path d="M24 11v28" stroke="currentColor" stroke-width="3"/><path d="M13 17c3-.5 6 0 8 1M13 23c3-.5 6 0 8 1" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol><symbol id="heart" viewBox="0 0 24 24"><path d="M12 20.5s-7.5-4.6-9.3-9.4C1.5 7.6 3.6 4.5 6.8 4.5c2 0 3.7 1.1 5.2 3 1.5-1.9 3.2-3 5.2-3 3.2 0 5.3 3.1 4.1 6.6-1.8 4.8-9.3 9.4-9.3 9.4z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol><symbol id="folder" viewBox="0 0 24 24"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5H9l2 2.5h8.5A1.5 1.5 0 0 1 21 9v9.5a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol></svg>

<header>
  <div><h1 id="h1">Библиотека</h1><div class="sub" id="sub">Манга и комиксы</div></div>
  <button class="ib fsb" aria-label="Полный экран"></button>
</header>
<section id="vAdd" hidden><div class="actions">
  <label class="btn" tabindex="0"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5H9l2 2.5h8.5A1.5 1.5 0 0 1 21 9v9.5a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18.5z"/></svg>Выбрать папку<input type="file" id="dir" webkitdirectory multiple></label>
  <label class="btn alt" tabindex="0">Выбрать файлы<input type="file" id="fil" multiple></label>
</div>
<div class="msg" id="msg">Если окно выбора не открывается, откройте эту страницу в Chrome.</div>
</section>
<main id="lib"></main>
<div class="shbar"><button class="ib" id="shDel">− Убрать полку</button><button class="ib" id="shAdd">+ Добавить полку</button></div>
<div class="sheet" id="ed"><div class="panel">
  <label class="lb">Название<input id="edName" type="text"></label>
  <button class="ib" id="edFav" style="align-self:flex-start"><svg class="hrt"><use href="#heart"/></svg>В избранное</button>
  <div class="lb">Обложка — страница <b id="edN"></b></div>
  <div class="pv"><img id="edImg" alt=""></div>
  <input type="range" id="edSl" min="1" value="1" aria-label="Страница для обложки">
  <div class="bt"><button class="ib" id="edDel" style="margin-right:auto;color:#ff8a8a">Удалить</button><button class="ib" id="edX">Отмена</button><button class="btn" id="edOk">Сохранить</button></div>
</div></div>

<nav id="nav">
  <button class="tab on" data-t="lib"><svg><use href="#book"/></svg><span>Библиотека</span></button>
  <button class="tab" data-t="fav"><svg class="hrt"><use href="#heart"/></svg><span>Избранное</span></button>
  <button class="tab" data-t="add"><svg><use href="#folder"/></svg><span>Папка</span></button>
</nav>

<section id="reader" aria-label="Чтение">
  <div id="stage"><img id="pg" alt=""></div>
  <div id="flip"><canvas id="fCv"></canvas></div>
  <div class="tb top"><button class="ib" id="back">Назад</button><div class="tt" id="tt"></div><button class="ib fsb" aria-label="Полный экран"></button><button class="ib" id="rdFav" aria-label="Избранное"><svg class="hrt"><use href="#heart"/></svg></button></div>
  <div class="tb bot">
    <input type="range" id="sl" min="1" value="1" aria-label="Страница">
    <span id="cnt"></span>
    <button class="ib" id="modeBtn"></button><button class="ib" id="dirBtn"></button>
    <button class="ib" id="fitBtn"></button>
  </div>
</section>

<div class="sheet" id="md"><div class="panel"><div class="lb">Режим чтения</div><button class="ib mo" data-m="none">Переключение страницы</button><button class="ib mo" data-m="curl">Книжное листание</button><button class="ib mo" data-m="h">Сдвиг по горизонтали</button><button class="ib mo" data-m="v">Сдвиг по вертикали</button></div></div>
<script src="jszip.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const IMG=/\.(jpe?g|png|webp|gif|avif|bmp)$/i, ZIP=/\.(cbz|zip|cbr|rar)$/i;
const nat=(a,b)=>a.localeCompare(b,undefined,{numeric:true,sensitivity:'base'});
const ls={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let books=[],cur=null,page=0,rtl=ls.get('rtl',true),wid=ls.get('wid',false),url=null,tok=0;

function icon(){return '<svg aria-hidden="true"><use href="#book"/></svg>'}
function render(){
  const lib=$('#lib');
  head();
  const FV=tab==='fav',list=FV?books.filter(isFav):books,emp=!list.length;lifted=null;
  lib.innerHTML=emp?'<div class="empty">'+icon()+(FV?'<b>В избранном пусто</b>Откройте том и нажмите на сердечко.':'<b>Здесь пока пусто</b>Откройте вкладку «Папка» и выберите мангу, чтобы поставить её на полку.')+'</div>':'';
  const n=innerWidth>=700?5:3,L=FV?chunk(list,n):layoutRows(n),need=Math.max(1,L.length),rows=FV?need:Math.max(ls.get('sh',1),need);
  const bw=(innerWidth-36-(n-1)*16)/n;
  $('#shDel').disabled=rows<=need;
  for(let r=0;r<rows;r++){const s=r*n;
    const row=document.createElement('div');row.className='row';row.dataset.r=r;row.style.setProperty('--n',n);
    const bs=document.createElement('div');bs.className='books';bs.style.minHeight=(bw*1.5+28)+'px';
    const pl=document.createElement('div');pl.className='plank';
    const cp=document.createElement('div');cp.className='caps';cp.style.minHeight='56px';
    (L[r]||[]).forEach(b=>{
      const p=ls.get('p:'+b.id,0), pct=b.count>1?Math.round(p/(b.count-1)*100):0;
      const c=document.createElement('button');c.className='card';c.setAttribute('aria-label',b.name);
      c.innerHTML='<div class="bk"><div class="pg"><i style="width:'+pct+'%"></i></div><div class="cv"></div></div>';
      press(c,b,c);bs.appendChild(c);
      const t=document.createElement('button');t.className='card';
      t.innerHTML='<div class="cn"></div><div class="cm">'+b.count+' стр. · '+pct+'%</div>';
      t.querySelector('.cn').textContent=b.name;press(t,b,c);cp.appendChild(t);
      if(!b.cover){b.get(b.cp||0).then(bl=>{b.cover=URL.createObjectURL(bl);setCover(c,b)}).catch(()=>{})}else setCover(c,b);
    });
    row.append(bs,pl,cp);lib.appendChild(row);
  }
}
function setCover(c,b){const i=new Image();i.alt='';i.src=b.cover;c.querySelector('.cv').prepend(i)}
function press(el,b,c){
  let tm=null,sx=0,sy=0,fired=false;
  const stop=()=>{clearTimeout(tm);tm=null};
  el.addEventListener('pointerdown',e=>{fired=false;sx=e.clientX;sy=e.clientY;tm=setTimeout(()=>{fired=true;try{navigator.vibrate&&navigator.vibrate(15)}catch(_){}grab(b,c,sx,sy)},500)});
  el.addEventListener('pointermove',e=>{if(tm&&Math.hypot(e.clientX-sx,e.clientY-sy)>10)stop()});
  ['pointerup','pointercancel','pointerleave'].forEach(t=>el.addEventListener(t,stop));
  el.addEventListener('click',()=>{if(fired){fired=false;return}if(lifted&&lifted.b===b){unlift();return}open(b)});
  el.addEventListener('contextmenu',e=>e.preventDefault());
}
let tab='lib',drag=null,lifted=null;
const favs=()=>ls.get('fav',[]),isFav=b=>favs().includes(b.id);
function toggleFav(b){const a=favs(),i=a.indexOf(b.id);if(i<0)a.push(b.id);else a.splice(i,1);ls.set('fav',a)}
const chunk=(a,n)=>{const r=[];for(let i=0;i<a.length;i+=n)r.push(a.slice(i,i+n));return r};
function head(){
  $('#h1').textContent={lib:'Библиотека',fav:'Избранное',add:'Добавить мангу'}[tab];
  $('#sub').textContent=tab==='add'?'Папка или файлы с устройства':tab==='fav'?('Томов: '+books.filter(isFav).length):(books.length?('Книг: '+books.length):'Манга и комиксы');
  if(saving)$('#sub').textContent+=' · сохраняю…';if(saveErr)$('#sub').textContent+=' · '+saveErr;
}
function setTab(t){
  tab=t;unlift();
  $('#lib').hidden=t==='add';$('#vAdd').hidden=t!=='add';$('.shbar').style.display=t==='lib'?'':'none';
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  head();if(t!=='add')render();scrollTo(0,0);
}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>setTab(b.dataset.t));
$('#rdFav').onclick=()=>{toggleFav(cur);$('#rdFav .hrt').classList.toggle('on',isFav(cur))};
$('#edFav').onclick=()=>{toggleFav(eb);$('#edFav .hrt').classList.toggle('on',isFav(eb))};
function layoutRows(n){
  const by={};books.forEach(b=>by[b.id]=b);
  const lay=ls.get('lay',[]).map(r=>r.filter(id=>by[id])),pl=new Set(lay.flat());
  books.forEach(b=>{if(pl.has(b.id))return;let r=lay.find(x=>x.length<n);if(!r){r=[];lay.push(r)}r.push(b.id);pl.add(b.id)});
  for(let i=0;i<lay.length;i++){if(lay[i].length>n){const ex=lay[i].splice(n);if(!lay[i+1])lay.push([]);lay[i+1].unshift(...ex)}}
  while(lay.length&&!lay[lay.length-1].length)lay.pop();
  return lay.map(r=>r.map(id=>by[id]));
}
function grab(b,c,x,y){lift(b,c);if(tab==='lib')drag={b,el:c,x0:x,y0:y,x,y,s0:scrollY,moved:false,row:null}}
function lift(b,c){
  unlift();c.classList.remove('open');c.classList.add('lift');c.parentNode.classList.add('top');
  const p=document.createElement('button');p.className='pen';p.textContent='✎ Изменить';
  p.style.left=(c.offsetLeft+c.offsetWidth/2)+'px';p.style.top=(c.offsetTop-20)+'px';
  p.addEventListener('click',e=>{e.stopPropagation();unlift();edit(b)});
  c.parentNode.appendChild(p);lifted={b,c,p};
}
function unlift(){if(!lifted)return;const{c,p}=lifted;c.classList.remove('lift');if(c.parentNode)c.parentNode.classList.remove('top');p.remove();lifted=null}
document.addEventListener('pointerdown',e=>{if(lifted&&!lifted.c.contains(e.target)&&!lifted.p.contains(e.target))unlift()});
function move(x,y){
  if(!drag)return;
  if(!drag.moved&&Math.hypot(x-drag.x0,y-drag.y0)<8)return;
  if(!drag.moved){drag.moved=true;drag.el.classList.add('drag');if(lifted)lifted.p.style.display='none'}
  drag.x=x;drag.y=y;drag.el.style.transform='translate('+(x-drag.x0)+'px,'+(y-drag.y0+scrollY-drag.s0)+'px)';
  const t=document.elementFromPoint(x,y),row=t&&t.closest?t.closest('.row'):null;
  if(row!==drag.row){if(drag.row)drag.row.classList.remove('drop');drag.row=row;if(row)row.classList.add('drop')}
  if(y<110)scrollBy(0,-14);else if(y>innerHeight-130)scrollBy(0,14);
}
function drop(){
  const d=drag;if(!d)return;drag=null;
  d.el.style.transform='';d.el.classList.remove('drag');
  document.querySelectorAll('.row.drop').forEach(r=>r.classList.remove('drop'));
  if(hot){hot.classList.remove('open');hot=null}
  if(!d.moved)return;
  if(!d.row){if(lifted)lifted.p.style.display='';return}
  const n=innerWidth>=700?5:3,lay=layoutRows(n).map(r=>r.map(b=>b.id)),to=+d.row.dataset.r;
  lay.forEach(r=>{const i=r.indexOf(d.b.id);if(i>=0)r.splice(i,1)});
  while(lay.length<=to)lay.push([]);
  const rc=d.row.getBoundingClientRect(),i=Math.max(0,Math.min(lay[to].length,Math.floor((d.x-rc.left)/(rc.width/n))));
  lay[to].splice(i,0,d.b.id);ls.set('lay',lay);render();
}
document.addEventListener('touchmove',e=>{if(!drag)return;e.preventDefault();move(e.touches[0].clientX,e.touches[0].clientY)},{passive:false});
document.addEventListener('touchend',()=>{if(drag)drop()});
document.addEventListener('touchcancel',()=>{if(drag)drop()});
document.addEventListener('mousemove',e=>{if(drag&&e.buttons)move(e.clientX,e.clientY)});
document.addEventListener('mouseup',()=>{if(drag)drop()});
let hot=null;
function heat(x,y){
  if(drag)return;
  const el=document.elementFromPoint(x,y),bk=el&&el.closest?el.closest('.books .card'):null;
  if(bk!==hot){if(hot)hot.classList.remove('open');hot=bk;if(bk)bk.classList.add('open')}
}
addEventListener('touchstart',e=>heat(e.touches[0].clientX,e.touches[0].clientY),{passive:true});
addEventListener('touchmove',e=>heat(e.touches[0].clientX,e.touches[0].clientY),{passive:true});
['touchend','touchcancel'].forEach(t=>addEventListener(t,()=>heat(-1,-1),{passive:true}));
function shelfInfo(){const n=innerWidth>=700?5:3,need=Math.max(1,layoutRows(n).length);return{need,cur:Math.max(ls.get('sh',1),need)}}
$('#shAdd').onclick=()=>{ls.set('sh',shelfInfo().cur+1);render()};

let unrarP=null;
function loadUnrar(){return unrarP||(unrarP=(async()=>{
  const base='https://cdn.jsdelivr.net/npm/node-unrar-js@2.0.2/esm/';
  const w=await fetch(base+'js/unrar.wasm').then(r=>{if(!r.ok)throw new Error('wasm '+r.status);return r.arrayBuffer()});
  let m;
  try{m=await import(base+'index.js')}catch(e){m=await import('https://cdn.jsdelivr.net/npm/node-unrar-js@2.0.2/+esm')}
  return {m,w};
})())}
let saving=0,saveErr='';
const DB={
  p:null,
  open(){return this.p||(this.p=new Promise((res,rej)=>{
    const q=indexedDB.open('mangalib',1);
    q.onupgradeneeded=()=>{const d=q.result;d.createObjectStore('f',{keyPath:'k'});d.createObjectStore('b',{keyPath:'gid'})};
    q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);
  }))},
  async tx(st,mode,fn){
    const d=await this.open();
    return new Promise((res,rej)=>{
      const t=d.transaction(st,mode),r=fn(t.objectStore(st));
      t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);
    });
  },
  put(st,rec){return this.tx(st,'readwrite',s=>s.put(rec))},
  get(st,k){return this.tx(st,'readonly',s=>s.get(k))},
  all(st){return this.tx(st,'readonly',s=>s.getAll())},
  del(st,k){return this.tx(st,'readwrite',s=>s.delete(k))}
};
const mimeOf=n=>/\.png$/i.test(n)?'image/png':/\.webp$/i.test(n)?'image/webp':/\.gif$/i.test(n)?'image/gif':'image/jpeg';
let act=null,aq=Promise.resolve();
const ajob=fn=>{const j=aq.then(fn);aq=j.catch(()=>{});return j};
async function arc(m){
  if(act&&act.gid===m.gid)return act;
  act=null;
  const f=m.file||(await DB.get('f',m.gid)).blob;
  if(m.type==='zip')act={gid:m.gid,z:await JSZip.loadAsync(f)};
  else{
    let u;try{u=await loadUnrar()}catch(e){unrarP=null;throw new Error('модуль RAR не загрузился: '+(e.message||e))}
    act={gid:m.gid,ex:await u.m.createExtractorFromData({wasmBinary:u.w,data:new Uint8Array(await f.arrayBuffer())})};
  }
  return act;
}
function mkBook(m){
  const b={id:m.id,gid:m.gid,name:m.name,count:m.count,type:m.type,names:m.names,meta:m};
  if(m.type==='img')b.get=async i=>m.files?m.files[i]:(await DB.get('f',m.gid+'#'+i)).blob;
  else b.get=i=>ajob(async()=>{
    const a=await arc(m),n=m.names[i];
    if(a.z)return a.z.file(n).async('blob');
    const r=a.ex.extract({files:[n]}),x=[...r.files][0].extraction;
    return new Blob([x&&x.data?x.data:x],{type:mimeOf(n)});
  });
  return b;
}
async function thumb(b){
  const bm=await createImageBitmap(await b.get(b.cp||0)),w=300,h=Math.round(bm.height*w/bm.width);
  const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(bm,0,0,w,h);
  return new Promise(r=>c.toBlob(r,'image/jpeg',.8));
}
async function saveMeta(b){
  try{
    let t=null;try{t=await thumb(b)}catch(e){}
    await DB.put('b',{gid:b.gid,id:b.id,name:b.meta.name,count:b.count,type:b.type,names:b.names,cover:t});
  }catch(e){}
}
async function persist(b,fs){
  saving++;head();
  try{
    if(b.type==='img'){for(let i=0;i<fs.length;i++)await DB.put('f',{k:b.gid+'#'+i,blob:fs[i]})}
    else await DB.put('f',{k:b.gid,blob:fs});
    await saveMeta(b);
    try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  }catch(e){saveErr='не сохранилось: '+(e&&e.name||'ошибка')}
  saving--;head();
}
async function restore(){
  try{
    const rs=await DB.all('b');
    rs.forEach(m=>{
      if(books.some(x=>x.gid===m.gid))return;
      const b=mkBook(m);b.init=1;b.name=ls.get('n:'+m.id,m.name);b.cp=ls.get('c:'+m.id,0);
      if(m.cover)b.cover=URL.createObjectURL(m.cover);
      books.push(b);
    });
    books.sort((a,b)=>nat(a.name,b.name));

  }catch(e){}
}

async function add(files){
  files=[...files];const groups={};let n=0;const fails=[],fresh=[];
  $('#msg').textContent='Загрузка…';
  for(const f of files){
    if(ZIP.test(f.name)){
      const id=f.name+f.size;
      if(books.some(x=>x.gid===id)){n++;continue}
      let m=null;
      try{
        const z=await JSZip.loadAsync(f);
        const names=Object.keys(z.files).filter(k=>!z.files[k].dir&&IMG.test(k)&&!/__MACOSX/.test(k)).sort(nat);
        if(names.length)m={type:'zip',names,file:f};
      }catch(e){
        if(/\.(cbr|rar)$/i.test(f.name)){
          try{
            let u;try{u=await loadUnrar()}catch(e3){unrarP=null;throw new Error('модуль RAR не загрузился: '+(e3.message||e3))}
            const ex=await u.m.createExtractorFromData({wasmBinary:u.w,data:new Uint8Array(await f.arrayBuffer())});
            const names=[...ex.getFileList().fileHeaders].filter(h=>!h.flags.directory&&IMG.test(h.name)).map(h=>h.name).sort(nat);
            if(names.length)m={type:'rar',names,file:f};
          }catch(e2){fails.push(f.name+' ('+(e2&&e2.message||e2)+')')}
        }else fails.push(f.name);
      }
      if(m){Object.assign(m,{gid:id,id,name:f.name.replace(ZIP,''),count:m.names.length});fresh.push([mkBook(m),f]);n++}
    }else if(IMG.test(f.name)){
      const p=f.webkitRelativePath||f.name,d=p.includes('/')?p.slice(0,p.lastIndexOf('/')):'Изображения';
      (groups[d]=groups[d]||[]).push(f);
    }
  }
  for(const d in groups){
    const fs=groups[d].sort((a,b)=>nat(a.name,b.name)),id=d+fs.length;
    if(books.some(x=>x.gid===id)){n++;continue}
    const m={type:'img',gid:id,id,name:d.split('/').pop(),count:fs.length,names:fs.map(x=>x.name),files:fs};
    fresh.push([mkBook(m),fs]);n++;
  }
  fresh.forEach(([b])=>{b.init=1;b.name=ls.get('n:'+b.id,b.name);b.cp=ls.get('c:'+b.id,0);books.push(b)});
  books.sort((a,b)=>nat(a.name,b.name));
  $('#msg').textContent=fails.length?('Не удалось открыть: '+fails.join(', ')):n?'':'Подходящих файлов не найдено. Нужны CBZ, CBR, ZIP или картинки.';
  render();if(n&&!fails.length)setTab('lib');
  fresh.forEach(([b,f])=>persist(b,f));
}

let fl=null,tp=null,swipedAt=0;
const MODES={none:'Переключение страницы',curl:'Книжное листание',h:'Сдвиг по горизонтали',v:'Сдвиг по вертикали'};

/* ================= Бумажное листание: curl-движок на canvas ================= */
const BIG=6000,RAD=Math.PI/180,LP=.35,LZ=.94;
const paperTex=(()=>{
  const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');
  x.fillStyle='#ece4d0';x.fillRect(0,0,128,128);
  for(let i=0;i<1100;i++){
    x.fillStyle=i%3?'rgba(120,100,70,'+(Math.random()*.09+.02)+')':'rgba(255,255,250,'+(Math.random()*.16+.04)+')';
    x.fillRect(Math.random()*128,Math.random()*128,Math.random()*2+.4,Math.random()*.9+.3);
  }
  x.lineWidth=.5;
  for(let i=0;i<70;i++){
    x.strokeStyle='rgba(130,110,80,'+(Math.random()*.12+.03)+')';
    const a=Math.random()*118+5,b=Math.random()*118+5,l=Math.random()*9+3,t=Math.random()*6.28;

  }

/* --- кэш предварительно подготовленных страниц (чтобы жест стартовал без задержки) --- */
const bakeC=new Map();
function geo(){const rd=$('#reader');return{W:rd.clientWidth||innerWidth,H:rd.clientHeight||innerHeight,dpr:Math.min(window.devicePixelRatio||1,2)}}
function bakeFor(i){
  const g=geo(),key=g.W+'x'+g.H+'@'+g.dpr,e=bakeC.get(i);
  if(e&&e.key===key)return e.p;
  const p=(async()=>{
    const u=await urlFor(i),im=new Image();im.src=u;
    try{await im.decode()}catch(err){if(!im.complete)await new Promise(r=>{im.onload=im.onerror=r})}
    const nw=im.naturalWidth||1,nh=im.naturalHeight||1,k=Math.min(1,g.W/nw,g.H/nh),w=nw*k,h=nh*k;
    let d=g.dpr;const area=w*h*d*d;if(area>2.4e6)d*=Math.sqrt(2.4e6/area);
    const c=document.createElement('canvas');c.width=Math.max(1,Math.round(w*d));c.height=Math.max(1,Math.round(h*d));
    const x=c.getContext('2d');x.imageSmoothingQuality='high';x.drawImage(im,0,0,c.width,c.height);
    return{c,w,h};
  })();
  p.catch(()=>{const q=bakeC.get(i);if(q&&q.p===p)bakeC.delete(i)});
  bakeC.set(i,{key,p});return p;
}
function prepNeighbors(){
  for(const k of [...bakeC.keys()])if(Math.abs(k-page)>1)bakeC.delete(k);
  const run=()=>{if(!cur)return;[page,page+1,page-1].forEach(i=>{if(i>=0&&i<cur.count)bakeFor(i).catch(()=>{})})};
  setTimeout(()=>{try{run()}catch(e){}},80);
}

/* --- геометрия завитка: страница скручивается в «рулон» вдоль направления d --- */
function setGeo(f,ang){
  f.ang=ang;const sx=rtl?1:-1,dx=sx*Math.cos(ang),dy=Math.sin(ang);
  f.dx=dx;f.dy=dy;f.phi=Math.atan2(dy,dx);
  const cs=[[0,0],[f.pw,0],[0,f.ph],[f.pw,f.ph]];let best=1e9,A=cs[0];
  for(const c of cs){const v=c[0]*dx+c[1]*dy;if(v<best){best=v;A=c}}
  f.Ax=A[0];f.Ay=A[1];
  let mx=0;for(const c of cs)mx=Math.max(mx,(c[0]-A[0])*dx+(c[1]-A[1])*dy);
  f.xmax=mx;f.r0=Math.max(15,Math.min(34,Math.min(f.pw,f.ph*.7)*.07));
  f.xend=mx+Math.PI*f.r0*1.5+(f.W-f.pw)/2/Math.max(.5,Math.abs(dx))+10;
}
const rOf=(f,c)=>f.r0*(1+.5*Math.min(1,c/f.xmax));
function dispOf(f,c){const r=rOf(f,c);return c<=Math.PI*r?c-r*Math.sin(c/r):2*c-Math.PI*r}
function solveC(f,L){
  let lo=0,hi=f.xend;if(dispOf(f,hi)<=L)return hi;
  for(let i=0;i<28;i++){const m=(lo+hi)/2;if(dispOf(f,m)<L)lo=m;else hi=m}
  return(lo+hi)/2;
}
const cFromP=(f,p)=>f.mode==='curl'?(f.fwd?p:1-p)*f.xend:p, pFromC=(f,c)=>f.mode==='curl'?(f.fwd?c/f.xend:1-c/f.xend):c;

async function flipStart(tgt,opt){
  opt=opt||{};
  const fwd=tgt>page,f=fl={tgt,fwd,p:0,ready:false,c:0,ct:0,ang0:opt.ang||0,mode:rmode};
  try{
    const [A,B]=await Promise.all([bakeFor(page),bakeFor(tgt)]);
    if(fl!==f)return;
    const g=geo(),curl=f.mode==='curl',leaf=fwd?A:B,under=fwd?B:A,cv=$('#fCv');
    if(cv.width!==Math.round(g.W*g.dpr)||cv.height!==Math.round(g.H*g.dpr)){cv.width=Math.round(g.W*g.dpr);cv.height=Math.round(g.H*g.dpr)}
    Object.assign(f,g,{A,B,leaf,under,ctx:cv.getContext('2d',{alpha:false}),pw:leaf.w,ph:leaf.h,px:(g.W-leaf.w)/2,py:(g.H-leaf.h)/2,ux:(g.W-under.w)/2,uy:(g.H-under.h)/2});
    if(curl){f.pat=f.ctx.createPattern(paperTex,'repeat');setGeo(f,f.ang0)}
    f.ready=true;$('#flip').style.display='block';
    const dragged=(curl&&f.fwd)?f.L!==undefined:f.pq!==undefined;
    if(dragged){applyDrag(f);f.c=f.ct;drawFrame(f,f.c)}else paint(f.p);
  }catch(e){if(fl===f)fl=null}
}
function applyDrag(f){
  if(f.mode!=='curl'){setTarget(f,f.pq||0);return}
  if(f.fwd){setGeo(f,f.angT||0);setTarget(f,solveC(f,f.L||0))}
  else{setGeo(f,f.ang0);setTarget(f,(1-(f.pq||0))*f.xend)}
}
/* плавное «догоняние» пальца: мягкая пружина по времени, а не по числу событий */
function setTarget(f,c){f.ct=c;if(!f.raf&&!f.busy)f.raf=requestAnimationFrame(n=>tickF(f,n))}
function tickF(f,now){
  f.raf=0;if(fl!==f||f.busy||!f.ready)return;
  const dt=Math.min(50,f.tl?now-f.tl:16);f.tl=now;
  const k=1-Math.pow(.5,dt/26),dc=f.ct-f.c;
  f.c=Math.abs(dc)<(f.mode==='curl'?.2:.002)?f.ct:f.c+dc*k;
  drawFrame(f,f.c);
  if(f.c!==f.ct)f.raf=requestAnimationFrame(n=>tickF(f,n));else f.tl=0;
}
function paint(p){const f=fl;if(!f||!f.ready)return;f.c=f.ct=cFromP(f,p);drawFrame(f,f.c)}

function drawFrame(f,c){if(f.mode==='curl')drawCurl(f,c);else drawSlide(f,c)}
function drawSlide(f,q){
  const {ctx,W,H,dpr}=f,vert=f.mode==='v',d=f.fwd?(vert?-1:(rtl?1:-1)):(vert?1:(rtl?-1:1)),ax=vert?H:W;
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.globalAlpha=1;ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  const A=f.A,B=f.B,SA=(ax+(vert?A.h:A.w))/2,SB=(ax+(vert?B.h:B.w))/2,o1=d*q*SA,o2=d*(q-1)*SB;
  ctx.drawImage(A.c,(W-A.w)/2+(vert?0:o1),(H-A.h)/2+(vert?o1:0),A.w,A.h);
  ctx.drawImage(B.c,(W-B.w)/2+(vert?0:o2),(H-B.h)/2+(vert?o2:0),B.w,B.h);

function drawCurl(f,c){
  const {ctx,W,H,dpr,pw,ph,px,py}=f;
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.globalAlpha=1;
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);

  if(c>=f.xend-.5)return;
  if(c<=.3){ctx.drawImage(f.leaf.c,px,py,pw,ph);return}
  const r=rOf(f,c),dx=f.dx,dy=f.dy,phi=f.phi,Cx=px+f.Ax,Cy=py+f.Ay,xmax=f.xmax,PI=Math.PI;
  const scr=()=>ctx.setTransform(dpr,0,0,dpr,0,0);
  const frame=()=>{scr();ctx.translate(Cx,Cy);ctx.rotate(phi)};
  const band=(lo,hi)=>{frame();ctx.beginPath();ctx.rect(lo,-BIG,hi-lo,2*BIG);ctx.clip()};
  const map=(off,s)=>{frame();ctx.translate(off,0);ctx.scale(s,1);ctx.rotate(-phi);ctx.translate(-f.Ax,-f.Ay)};
  const shade=(lo,hi,x0,a0,x1,a1,rc)=>{
    ctx.save();band(lo,hi);scr();ctx.beginPath();ctx.rect(rc[0],rc[1],rc[2],rc[3]);ctx.clip();
    const g=ctx.createLinearGradient(Cx+dx*x0,Cy+dy*x0,Cx+dx*x1,Cy+dy*x1);
    g.addColorStop(0,'rgba(0,0,0,'+a0.toFixed(3)+')');g.addColorStop(1,'rgba(0,0,0,'+a1.toFixed(3)+')');

  };

  const edge=c-r*Math.sin(Math.min(PI/2,c/r));
  /* ещё не снятая часть страницы + тень от завитка на неё */
  ctx.save();band(c-.3,BIG);map(0,1);ctx.drawImage(f.leaf.c,0,0,pw,ph);ctx.restore();
  /* рулон: узкие полоски, каждая со своим наклоном к свету */
  const total=Math.min(PI*r,c),w=Math.max(3.5,PI*r/20),m=Math.ceil(total/w);
  for(let j=0;j<m;j++){
    const hi=c-j*w,lo=Math.max(c-(j+1)*w,c-total);if(lo>=xmax)continue;
    const a0=(c-hi)/r,a1=(c-lo)/r,am=(a0+a1)/2,Ph=c-r*Math.sin(a0),Pl=c-r*Math.sin(a1),dP=Ph-Pl;
    if(Math.abs(dP)<.05)continue;
    const s=dP/(hi-lo),off=Ph-s*hi,back=am>PI/2,sn=Math.sin(am),cs=Math.cos(am);
    ctx.save();band(Math.min(Ph,Pl)-.35,Math.max(Ph,Pl)+.35);map(off,s);
    let a,rgb;
    if(!back){
      ctx.drawImage(f.leaf.c,0,0,pw,ph);
      const nl=sn*LP+cs*LZ,b=.52+.48*Math.max(-.3,Math.min(1,nl));a=1-b;rgb='0,0,0';
      const sh=Math.max(0,1-Math.abs(am-1.05)/.45)*.15;
      if(sh>.01){ctx.fillStyle='rgba(255,255,255,'+sh.toFixed(3)+')';ctx.fillRect(0,0,pw,ph)}
    }else{
      ctx.fillStyle='#e9e1cd';ctx.fillRect(0,0,pw,ph);
      ctx.globalAlpha=.16;ctx.drawImage(f.leaf.c,0,0,pw,ph);ctx.globalAlpha=1;
      const nl=-sn*LP-cs*LZ,b=.6+.4*Math.max(-.4,Math.min(1,nl));a=(1-b)*.85;rgb='60,40,20';
    }
    if(a>.012){ctx.fillStyle='rgba('+rgb+','+a.toFixed(3)+')';ctx.fillRect(0,0,pw,ph)}
    ctx.restore();
  }
  /* отвёрнутый лист: тыльная сторона бумаги с просвечивающим рисунком */
  if(full){
    const K=2*c-PI*r;
    ctx.save();band(c-.35,K+.35);map(K,-1);
    ctx.fillStyle=f.pat;ctx.fillRect(0,0,pw,ph);
    ctx.globalAlpha=.16;ctx.drawImage(f.leaf.c,0,0,pw,ph);ctx.globalAlpha=1;
    const x0=c-PI*r,g=ctx.createLinearGradient(f.Ax+dx*x0,f.Ay+dy*x0,f.Ax+dx*(x0-r*2.4),f.Ay+dy*(x0-r*2.4));
    g.addColorStop(0,'rgba(60,40,20,.26)');g.addColorStop(1,'rgba(60,40,20,.03)');
    ctx.fillStyle=g;ctx.fillRect(0,0,pw,ph);
    ctx.strokeStyle='rgba(255,252,240,.55)';ctx.lineWidth=1.1;ctx.strokeRect(0,0,pw,ph);
    ctx.restore();
  }
}

function flipFinish(commit){
  const f=fl;if(!f||f.busy)return;f.busy=true;
  if(f.raf){cancelAnimationFrame(f.raf);f.raf=0}
  const done=async()=>{
    if(commit){page=f.tgt;await show();try{await $('#pg').decode()}catch(e){}}
    $('#flip').style.display='none';if(fl===f)fl=null;
  };
  if(!f.ready){done();return}
  f.p=pFromC(f,f.c);
  const from=f.p,to=commit?1:0,t0=performance.now(),sl=f.mode!=='curl',dur=f.tap?(sl?420:680):(sl?180+180*Math.abs(to-from):230+330*Math.abs(to-from));
  const step=now=>{
    const k=Math.min(1,(now-t0)/dur),e=f.tap?-(Math.cos(Math.PI*k)-1)/2:1-Math.pow(1-k,3);
    f.p=from+(to-from)*e;paint(f.p);
    if(k<1)requestAnimationFrame(step);else done();
  };
  requestAnimationFrame(step);
}
async function turn(d,y){
  const tgt=page+d;if(fl||tgt<0||tgt>=cur.count)return;
  zoomOff();
  if(rmode==='none'){go(d);return}
  await flipStart(tgt,{ang:((y==null?.8:y)>.5?-1:1)*12*RAD});
  if(fl&&fl.tgt===tgt){fl.tap=true;flipFinish(true)}
}

/* ---------------- жесты ---------------- */
const stg=$('#stage');
function pageRect(){const r=$('#pg').getBoundingClientRect();return r.width>40&&r.height>40?r:null}
/* ---- двойной тап: увеличение страницы ---- */
const ZS=2;let zm={s:1,tx:0,ty:0,base:null},pan=null;
function zApply(){$('#pg').style.transform=zm.s>1?'translate('+zm.tx+'px,'+zm.ty+'px) scale('+zm.s+')':''}
function zClamp(){
  const b=zm.base,W=stg.clientWidth,H=stg.clientHeight,w=b.width*zm.s,h=b.height*zm.s;
  let l=b.left+zm.tx,t=b.top+zm.ty;
  l=w<=W?(W-w)/2:Math.min(0,Math.max(W-w,l));
  t=h<=H?(H-h)/2:Math.min(0,Math.max(H-h,t));
  zm.tx=l-b.left;zm.ty=t-b.top;
}
function zAnim(){stg.classList.add('anim');clearTimeout(zAnim.t);zAnim.t=setTimeout(()=>stg.classList.remove('anim'),260)}
function zoomOn(px,py){
  const r=pageRect();if(!r||fl)return;
  const sr=stg.getBoundingClientRect(),b={left:r.left-sr.left,top:r.top-sr.top,width:r.width,height:r.height};
  const x=px-sr.left,y=py-sr.top,u=Math.max(0,Math.min(1,(x-b.left)/b.width)),v=Math.max(0,Math.min(1,(y-b.top)/b.height));
  zm.base=b;zm.s=ZS;zm.tx=x-u*b.width*ZS-b.left;zm.ty=y-v*b.height*ZS-b.top;
  zClamp();stg.classList.add('zm');zAnim();zApply();
}
function zoomOff(a){
  if(zm.s===1&&!stg.classList.contains('zm'))return;
  zm.s=1;zm.tx=zm.ty=0;pan=null;
  if(a){zAnim();setTimeout(()=>{if(zm.s===1)stg.classList.remove('zm')},240)}
  else{stg.classList.remove('anim');stg.classList.remove('zm')}
  zApply();
}
let zw=innerWidth;addEventListener('resize',()=>{if(innerWidth!==zw){zw=innerWidth;zoomOff()}});
stg.addEventListener('touchstart',e=>{
  if(zm.s>1){tp=null;const t=e.touches[0];pan=e.touches.length===1?{x:t.clientX,y:t.clientY,tx:zm.tx,ty:zm.ty,moved:false}:null;return}
  if(e.touches.length!==1||fl){tp=null;return}
  const t=e.touches[0],r=pageRect();let corner=0;
  if(r&&!wid&&rmode==='curl'){
    const nx=rtl?(t.clientX-r.left)/r.width:(r.right-t.clientX)/r.width;
    if(nx>-.08&&nx<.32){const ty=(t.clientY-r.top)/r.height;if(ty<.3)corner=1;else if(ty>.7)corner=-1}
  }
  tp={x:t.clientX,y:t.clientY,t:Date.now(),on:false,dx:0,dy:0,corner,half:t.clientY>innerHeight/2?-1:1};
},{passive:true});
stg.addEventListener('touchmove',e=>{
  if(zm.s>1){
    if(!pan||e.touches.length!==1){pan=null;return}
    const t=e.touches[0],dx=t.clientX-pan.x,dy=t.clientY-pan.y;
    if(Math.hypot(dx,dy)>8)pan.moved=true;
    zm.tx=pan.tx+dx;zm.ty=pan.ty+dy;zClamp();zApply();
    if(e.cancelable)e.preventDefault();return;
  }
  if(!tp||e.touches.length!==1)return;
  const t=e.touches[0],dx=t.clientX-tp.x,dy=t.clientY-tp.y,fx=rtl?dx:-dx,vert=rmode==='v';
  if(!tp.on){
    let fwd;
    if(vert){
      if(wid)return;
      if(Math.abs(dy)<12||Math.abs(dy)<Math.abs(dx)*1.3){if(Math.abs(dx)>14)tp=null;return}
      fwd=dy<0;
    }else{
      const k=tp.corner&&fx>0?.45:1.3;
      if(Math.abs(dx)<12||Math.abs(dx)<Math.abs(dy)*k){if(Math.abs(dy)>(tp.corner?26:14))tp=null;return}
      fwd=fx>0;
    }
    const tgt=page+(fwd?1:-1);
    if(tgt<0||tgt>=cur.count){tp=null;return}
    tp.on=true;tp.fwd=fwd;tp.first=true;tp.ang=0;
    if(rmode!=='none')flipStart(tgt,fwd?{}:{ang:tp.half*8*RAD});
  }
  tp.dx=dx;tp.dy=dy;
  if(rmode==='none'){if(e.cancelable)e.preventDefault();return}
  const f=fl;
  if(f){
    if(f.mode!=='curl'){
      const al=vert?(f.fwd?-dy:dy):(f.fwd?fx:-fx);
      f.pq=Math.max(0,Math.min(1,al/(vert?innerHeight:innerWidth)));
    }else if(tp.fwd){
      const lim=(tp.corner?58:10)*RAD;let a=Math.atan2(dy,Math.max(fx,1));
      a=tp.corner>0?Math.max(0,Math.min(lim,a)):tp.corner<0?Math.max(-lim,Math.min(0,a)):Math.max(-lim,Math.min(lim,a));
      tp.ang=tp.first?a:tp.ang+(a-tp.ang)*.35;tp.first=false;
      const sx=rtl?1:-1;
      f.L=Math.max(0,dx*sx*Math.cos(tp.ang)+dy*Math.sin(tp.ang));f.angT=tp.ang;
    }else f.pq=Math.max(0,Math.min(1,-fx/(innerWidth*.8)));
    if(f.ready)applyDrag(f);
  }
  if(e.cancelable)e.preventDefault();
},{passive:false});
stg.addEventListener('touchend',()=>{
  if(pan){if(pan.moved)swipedAt=Date.now();pan=null;return}
  if(!tp||!tp.on){tp=null;return}
  const t=tp,v=Math.hypot(t.dx,t.dy)/(Date.now()-t.t+1);
  tp=null;swipedAt=Date.now();
  if(rmode==='none'){if(Math.hypot(t.dx,t.dy)>50||v>.4)go(t.fwd?1:-1);return}
  const f=fl;if(!f)return;
  const cf=f.mode==='curl'&&f.fwd,prog=cf?(f.ready?Math.min(1,f.ct/f.xmax):0):(f.pq||0);
  flipFinish(prog>(cf?.4:.3)||(v>.45&&prog>.05));
});
stg.addEventListener('touchcancel',()=>{pan=null;if(tp&&tp.on){swipedAt=Date.now();flipFinish(false)}tp=null});

/* ---------------- выбор режима чтения ---------------- */
function modeUI(){
  $('#modeBtn').textContent=MODES[rmode];
  document.querySelectorAll('.mo').forEach(b=>b.classList.toggle('on',b.dataset.m===rmode));
}
$('#modeBtn').onclick=()=>$('#md').classList.add('on');
document.querySelectorAll('.mo').forEach(b=>b.onclick=()=>{rmode=b.dataset.m;ls.set('rmode',rmode);modeUI();$('#md').classList.remove('on')});
$('#md').onclick=e=>{if(e.target===$('#md'))$('#md').classList.remove('on')};
modeUI();
function go(d){const n=Math.max(0,Math.min(cur.count-1,page+d));if(n!==page){page=n;show()}}
function tapAct(cx,cy){
  if(zm.s>1){$('#reader').classList.toggle('hide');return}
  const x=cx/innerWidth;
  if(x<.3)turn(rtl?1:-1,cy/innerHeight);else if(x>.7)turn(rtl?-1:1,cy/innerHeight);else $('#reader').classList.toggle('hide');
}
let tapT=0,tapX=0,tapY=0,tapTm=null;
$('#stage').onclick=e=>{
  if(Date.now()-swipedAt<400)return;
  const now=Date.now(),cx=e.clientX,cy=e.clientY;
  if(tapTm&&now-tapT<320&&Math.hypot(cx-tapX,cy-tapY)<45){
    clearTimeout(tapTm);tapTm=null;
    if(zm.s>1)zoomOff(true);else zoomOn(cx,cy);
    return;
  }
  tapT=now;tapX=cx;tapY=cy;
  tapTm=setTimeout(()=>{tapTm=null;tapAct(cx,cy)},280);
};
$('#sl').oninput=e=>{page=+e.target.value-1;show()};
$('#dirBtn').onclick=()=>{rtl=!rtl;ls.set('rtl',rtl);opts()};
$('#fitBtn').onclick=()=>{wid=!wid;ls.set('wid',wid);opts()};
$('#back').onclick=()=>{zoomOff();$('#reader').classList.remove('on');tok++;clearPc();render()};
addEventListener('keydown',e=>{
  if(!cur||!$('#reader').classList.contains('on'))return;
  if(e.key==='ArrowLeft')turn(rtl?1:-1);else if(e.key==='ArrowRight')turn(rtl?-1:1);else if(e.key==='Escape')$('#back').click();
});
/* ---------------- полный экран (прячет панель браузера) ---------------- */
const FSE=document.documentElement,fsOk=!window.Capacitor&&!!(FSE.requestFullscreen||FSE.webkitRequestFullscreen);
if(window.Capacitor){const d=$('#dir');if(d&&d.parentNode)d.parentNode.style.display='none'}
let fsAuto=ls.get('fs',true);
const inFS=()=>!!(document.fullscreenElement||document.webkitFullscreenElement);
function fsEnter(){
  if(!fsOk||inFS())return;
  try{const p=(FSE.requestFullscreen||FSE.webkitRequestFullscreen).call(FSE,{navigationUI:'hide'});if(p&&p.catch)p.catch(()=>{})}catch(e){}
}
function fsExit(){try{(document.exitFullscreen||document.webkitExitFullscreen).call(document)}catch(e){}}
const FS_IN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>';
const FS_OUT='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>';
function fsUI(){document.querySelectorAll('.fsb').forEach(b=>{b.hidden=!fsOk;b.innerHTML=inFS()?FS_OUT:FS_IN})}
document.querySelectorAll('.fsb').forEach(b=>b.onclick=()=>{
  if(inFS()){fsAuto=false;ls.set('fs',false);fsExit()}
  else{fsAuto=true;ls.set('fs',true);fsEnter()}
});
document.addEventListener('click',e=>{
  if(e.target.closest&&e.target.closest('.fsb'))return;
  if(fsAuto&&!inFS())fsEnter();
},true);
['fullscreenchange','webkitfullscreenchange'].forEach(t=>document.addEventListener(t,()=>{if(!inFS())fsAuto=false;fsUI()}));
fsUI();
render();restore();
</script>
</body>
